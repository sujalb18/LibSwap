<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Swap Request</title>
  <link rel="stylesheet" href="css/swap.css">
</head>

<body>

  <h2>Book Details</h2>

  <div id="book-container">
    <!-- These values will be filled dynamically -->
    <p><strong>Book:</strong> <span id="book-title"></span></p>
    <p><strong>Owner:</strong> <span id="book-owner"></span></p>

    <button id="swapBtn" class="btn">Request Swap</button>
  </div>

  <!-- Swap Modal -->
  <div id="swapModal" class="modal">
    <div class="modal-content">
      <h3>Request Swap</h3>

      <textarea id="swapMessage" placeholder="Add a message (optional)"></textarea>

      <div class="actions">
        <button id="sendSwap" class="btn success">Send Request</button>
        <button id="closeModal" class="btn cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/swap.js"></script>
</body>

</html>
