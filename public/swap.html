<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swap Request</title>
  <link rel="stylesheet" href="css/swap.css">
</head>
<body>

  <header>
    <h1>Send Swap Request</h1>
    <button id="backBtn">Back to Dashboard</button>
  </header>

  <main>
    <section>
      <h2>Select a Book to Request</h2>
      <div id="availableBooks"></div>
    </section>

    <section>
      <h2>Your Books (to offer)</h2>
      <div id="myBooks"></div>
    </section>

    <section>
      <h2>Send Request</h2>
      <button id="sendRequestBtn" disabled>Send Swap Request</button>
      <p id="statusMsg"></p>
    </section>
  </main>

  <script src="js/swap.js"></script>
</body>
</html>
